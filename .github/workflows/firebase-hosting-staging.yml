name: Deploy test site to Firebase Hosting

on:
  push:
    branches:
      - staging

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  deploy_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: echo "No build step required."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAINYELONTHEMOVE }}
          channelId: live
          target: staging
          projectId: dainyelonthemove
