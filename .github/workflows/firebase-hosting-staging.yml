name: Deploy test site to Firebase Hosting

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '.github/**'
      - '.devcontainer/**'

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Preserve only the verified current public reading copy
        run: python3 .github/tools/public-content-snapshot.py --mode retain --space staging
      - name: Refuse a stale source checkout
        run: test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/staging | cut -f1)"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAINYELONTHEMOVE }}
          channelId: live
          target: staging
          projectId: dainyelonthemove
