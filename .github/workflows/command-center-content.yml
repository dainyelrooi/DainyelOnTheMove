name: Command Center private calendar import

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Private Command Center calendar job ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: command-center-private-calendar
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'dainyelrooi/DainyelOnTheMove' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAINYELONTHEMOVE }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: dainyelonthemove
      - name: Import private drafts without publishing or sending email
        env:
          COMMAND_CENTER_JOB: ${{ inputs.job_id }}
        run: python3 .github/tools/command-center-content.py
