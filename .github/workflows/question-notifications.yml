name: Private question email notifications

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/question-notifications.yml
      - .github/tools/question-notifications.py
      - .github/tests/test_question_notifications.py
  workflow_dispatch:
    inputs:
      mode:
        description: Check access, initialize once, send one verification, or notify
        required: true
        default: check
        type: choice
        options: [check, initialize, verification, notify]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: private-question-notifications
  cancel-in-progress: false

jobs:
  question_mail:
    if: github.repository == 'dainyelrooi/DainyelOnTheMove' && (github.event_name != 'schedule' || vars.QUESTION_NOTIFICATIONS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIRESTORE_QUOTA_STATE: .firestore-budget/state.json
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check notification rendering and retry safety
        run: python3 -m unittest discover -s .github/tests -p test_question_notifications.py
      - name: Check the shared free database quota deadline
        id: budget
        uses: ./.github/actions/firestore-budget
      - uses: google-github-actions/auth@v2
        if: steps.budget.outputs.available == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAINYELONTHEMOVE }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.budget.outputs.available == 'true'
        with:
          project_id: dainyelonthemove
      - name: Check or send private owner notifications
        if: steps.budget.outputs.available == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode || 'check' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          QUESTION_NOTIFY_TO: ${{ secrets.QUESTION_NOTIFY_TO }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          if [[ "$EVENT_NAME" == 'schedule' ]]; then mode='notify'; fi
          python3 .github/tools/question-notifications.py --mode "$mode"
      - name: Preserve only a newly observed quota deadline
        if: ${{ always() && steps.budget.outputs.available == 'true' && hashFiles('.firestore-budget/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .firestore-budget/state.json
          key: ${{ steps.budget.outputs.cache-key }}
